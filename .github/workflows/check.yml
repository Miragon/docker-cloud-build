# yarn dist (lint, type check, bundle) for every push to main and every pull request. The action runs from the
# checked-in dist/, so dist/ must be exactly what yarn dist builds from this commit (.github/dependency-updates.md).
# Actions are pinned by commit; Renovate updates them.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Major as runs.using in action.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn dist
      - name: dist/ is the build of this commit
        run: |
          changes=$(git status --porcelain -- dist/)
          [ -z "$changes" ] && exit 0
          printf '%s\n' "$changes"
          echo "::error::dist/ differs from yarn dist: run yarn install and yarn dist, then commit dist/"
          exit 1
